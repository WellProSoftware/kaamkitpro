name: KaamKitPro health monitor and staging recovery

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches:
      - cloudflare/vinext-staging
    paths:
      - ".github/workflows/kaamkitpro-health-monitor.yml"
      - "scripts/health-monitor.mjs"
      - "scripts/cloudflare-current-worker-version.mjs"

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: kaamkitpro-health-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Read-only production check and guarded staging recovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout staging monitor scripts
        uses: actions/checkout@v4
        with:
          ref: cloudflare/vinext-staging

      - name: Check production and staging endpoints
        id: initial
        env:
          PRODUCTION_URL: https://kaamkitpro.com/
          STAGING_BASE_URL: https://kaamkitpro-staging.ankitkd550.workers.dev
          SCOPE: all
        run: node scripts/health-monitor.mjs

      - name: Read current staging Worker version
        id: current
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKER_NAME: kaamkitpro-staging
        run: node scripts/cloudflare-current-worker-version.mjs

      # This rollback is staging-only. It never changes kaamkitpro-production,
      # custom domains, DNS, Supabase schemas, or production payment settings.
      - name: Roll back an unhealthy staging release to the last known-good version
        id: rollback
        if: steps.initial.outputs.staging_healthy != 'true' && vars.KAAMKITPRO_STAGING_LAST_GOOD_VERSION != '' && steps.current.outputs.version != vars.KAAMKITPRO_STAGING_LAST_GOOD_VERSION
        env:
          LAST_GOOD_VERSION: ${{ vars.KAAMKITPRO_STAGING_LAST_GOOD_VERSION }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.166.0 rollback "$LAST_GOOD_VERSION" --name kaamkitpro-staging --message "Automatic staging rollback after failed health checks"

      - name: Recheck staging after automatic rollback
        id: recheck
        if: steps.rollback.outcome == 'success'
        env:
          STAGING_BASE_URL: https://kaamkitpro-staging.ankitkd550.workers.dev
          SCOPE: staging
        run: node scripts/health-monitor.mjs

      - name: Read active staging version after health check or recovery
        id: active_version
        if: steps.initial.outputs.staging_healthy == 'true' || steps.recheck.outputs.staging_healthy == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKER_NAME: kaamkitpro-staging
        run: node scripts/cloudflare-current-worker-version.mjs

      - name: Save healthy staging version as the next rollback target
        if: steps.initial.outputs.staging_healthy == 'true' || steps.recheck.outputs.staging_healthy == 'true'
        uses: actions/github-script@v7
        env:
          ACTIVE_VERSION: ${{ steps.active_version.outputs.version }}
        with:
          script: |
            const name = "KAAMKITPRO_STAGING_LAST_GOOD_VERSION";
            const value = process.env.ACTIVE_VERSION;
            if (!value) {
              core.setFailed("Active staging version was not available; refusing to update the rollback target.");
              return;
            }
            try {
              await github.rest.actions.updateRepoVariable({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name,
                value,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.actions.createRepoVariable({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name,
                value,
              });
            }
            core.notice(`Saved last known-good staging version: ${value}`);

      - name: Create or update a health alert issue
        if: steps.initial.outputs.production_healthy != 'true' || steps.initial.outputs.staging_healthy != 'true' || steps.rollback.outcome == 'success'
        uses: actions/github-script@v7
        env:
          INITIAL_SUMMARY: ${{ steps.initial.outputs.summary }}
          RECHECK_SUMMARY: ${{ steps.recheck.outputs.summary }}
          PRODUCTION_HEALTHY: ${{ steps.initial.outputs.production_healthy }}
          STAGING_HEALTHY: ${{ steps.initial.outputs.staging_healthy }}
          RECHECK_HEALTHY: ${{ steps.recheck.outputs.staging_healthy }}
          ROLLBACK_OUTCOME: ${{ steps.rollback.outcome }}
          LAST_GOOD_VERSION: ${{ vars.KAAMKITPRO_STAGING_LAST_GOOD_VERSION }}
        with:
          script: |
            const title = "[Health Alert] KaamKitPro health monitor";
            const body = [
              "The scheduled KaamKitPro health monitor detected an issue.",
              "",
              `Production check: ${process.env.PRODUCTION_HEALTHY}`,
              `Initial staging check: ${process.env.STAGING_HEALTHY}`,
              `Staging recheck after rollback: ${process.env.RECHECK_HEALTHY || "not run"}`,
              `Rollback outcome: ${process.env.ROLLBACK_OUTCOME || "not run"}`,
              `Previous last-good version: ${process.env.LAST_GOOD_VERSION || "not seeded yet"}`,
              "",
              "Initial probe results:",
              process.env.INITIAL_SUMMARY || "(no summary)",
              "",
              "Post-rollback probe results:",
              process.env.RECHECK_SUMMARY || "(not applicable)",
              "",
              "Production is monitored read-only. Automatic rollback is restricted to the isolated staging Worker.",
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
