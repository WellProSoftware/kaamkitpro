name: npm security audit report (no fixes)

on:
  pull_request:
    branches:
      - cloudflare/vinext-staging
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/npm-audit-report.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Generate npm audit report only
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Generate full audit JSON (do not change dependencies)
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit-report.json
          audit_exit=$?
          set -e
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('npm-audit-report.json', 'utf8'));
          const meta = report.metadata?.vulnerabilities ?? {};
          console.log('npm audit severity summary:');
          for (const severity of ['info', 'low', 'moderate', 'high', 'critical']) {
            console.log(`- ${severity}: ${meta[severity] ?? 0}`);
          }
          console.log('\nAffected packages:');
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(JSON.stringify({
              name,
              severity: item.severity,
              isDirect: item.isDirect,
              installedRange: item.range,
              fixAvailable: item.fixAvailable,
              via: item.via
            }));
          }
          NODE
          echo "npm audit exit code: ${audit_exit}"
      - name: Upload full audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          if-no-files-found: warn
          retention-days: 14
