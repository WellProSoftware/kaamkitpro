name: Cloudflare Workers Free staging validation

on:
  push:
    branches:
      - cloudflare/vinext-staging
  workflow_dispatch:
    inputs:
      deploy_to_workers_dev:
        description: "Deploy the validated staging build to workers.dev (never production)"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: kaamkitpro-cloudflare-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Vinext compatibility, build, and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      KAAMKITPRO_STAGING: "true"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v5
        with:
          ref: cloudflare/vinext-staging
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Regenerate staging lockfile for declared CSS build plugin
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install existing application dependencies
        run: npm ci

      - name: Check Next.js API compatibility before migration
        id: compatibility
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npx vinext check 2>&1 | tee vinext-compatibility-report.txt
          status=${PIPESTATUS[0]}
          echo "$status" > vinext-compatibility-exit-code.txt
          exit "$status"

      - name: Initialize Cloudflare Workers config without paid add-ons
        id: init
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f vite.config.ts ] || ! node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['build:vinext'] ? 0 : 1)"; then
            npx vinext init \
              --platform=cloudflare \
              --skip-check \
              --data-cache=none \
              --cdn-cache=workers-cache \
              --image-optimization=none
          else
            echo "vinext config already initialized; retaining the staging configuration."
          fi
          test -f vite.config.ts
          if [ ! -f cloudflare.config.ts ] && [ ! -f wrangler.jsonc ]; then
            echo "Expected Cloudflare config (cloudflare.config.ts or wrangler.jsonc) was not generated."
            exit 1
          fi
          node -e "const p=require('./package.json'); if (!p.scripts?.['build:vinext'] || !p.scripts?.['start:vinext']) process.exit(1)"

      - name: Recheck compatibility after vinext initialization
        id: compatibility_post
        if: always() && steps.init.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npx vinext check 2>&1 | tee vinext-postinit-compatibility-report.txt
          status=${PIPESTATUS[0]}
          echo "$status" > vinext-postinit-compatibility-exit-code.txt
          exit "$status"

      - name: Build the Cloudflare/vinext output
        id: vinext_build
        if: always() && steps.init.outcome == 'success'
        continue-on-error: true
        run: set -o pipefail; npm run build:vinext 2>&1 | tee vinext-build.log

      - name: TypeScript check including generated Cloudflare types
        id: types
        if: always() && steps.init.outcome == 'success'
        continue-on-error: true
        run: set -o pipefail; npx tsc --noEmit 2>&1 | tee typescript-check.log

      - name: Lint
        id: lint
        if: always() && steps.init.outcome == 'success'
        continue-on-error: true
        run: set -o pipefail; npm run lint 2>&1 | tee lint.log

      - name: Recheck the original Next.js build
        id: next_build
        if: always() && steps.init.outcome == 'success'
        continue-on-error: true
        run: set -o pipefail; npm run build 2>&1 | tee next-build.log

      - name: Install isolated browser-test dependencies
        id: playwright_install
        if: always() && steps.vinext_build.outcome == 'success'
        continue-on-error: true
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium

      - name: Run existing regressions plus Cloudflare staging checks
        id: browser_tests
        if: always() && steps.playwright_install.outcome == 'success'
        continue-on-error: true
        run: set -o pipefail; npx playwright test -c playwright.cloudflare.config.mjs 2>&1 | tee cloudflare-playwright.log

      - name: Commit generated Cloudflare source configuration to staging branch
        if: always() && steps.init.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore package.json package-lock.json tsconfig.json vite.config.ts src/app/layout.tsx src/app/robots.ts
          for config in cloudflare.config.ts wrangler.jsonc; do
            if [ -f "$config" ]; then git add "$config"; fi
          done
          if git diff --cached --quiet; then
            echo "No generated source changes to commit."
          else
            git commit -m "chore: initialize vinext Cloudflare staging"
            git push origin HEAD:cloudflare/vinext-staging
          fi

      - name: Upload compatibility and test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kaamkitpro-cloudflare-staging-reports
          if-no-files-found: warn
          retention-days: 7
          path: |
            vinext-compatibility-report.txt
            vinext-compatibility-exit-code.txt
            vinext-postinit-compatibility-report.txt
            vinext-postinit-compatibility-exit-code.txt
            vinext-build.log
            typescript-check.log
            lint.log
            next-build.log
            cloudflare-playwright.log
            test-results/
            playwright-report/

      - name: Enforce staging validation gate
        if: always()
        shell: bash
        env:
          COMPATIBILITY: ${{ steps.compatibility.outcome }}
          INITIALIZATION: ${{ steps.init.outcome }}
          COMPATIBILITY_POST: ${{ steps.compatibility_post.outcome }}
          VINEXT_BUILD: ${{ steps.vinext_build.outcome }}
          TYPESCRIPT: ${{ steps.types.outcome }}
          LINT: ${{ steps.lint.outcome }}
          NEXT_BUILD: ${{ steps.next_build.outcome }}
          PLAYWRIGHT_INSTALL: ${{ steps.playwright_install.outcome }}
          BROWSER_TESTS: ${{ steps.browser_tests.outcome }}
        run: |
          failed=0
          for item in \
            "vinext check:$COMPATIBILITY" \
            "vinext init:$INITIALIZATION" \
            "post-init vinext check:$COMPATIBILITY_POST" \
            "vinext build:$VINEXT_BUILD" \
            "TypeScript:$TYPESCRIPT" \
            "lint:$LINT" \
            "Next.js build:$NEXT_BUILD" \
            "Playwright install:$PLAYWRIGHT_INSTALL" \
            "browser tests:$BROWSER_TESTS"; do
            echo "$item"
            case "$item" in
              *:success) ;;
              *) failed=1 ;;
            esac
          done
          if [ "$failed" -ne 0 ]; then
            echo "One or more checks failed. Review the uploaded logs; do not deploy this branch until the failures are resolved."
            exit 1
          fi
          echo "Compatibility, build, TypeScript, lint, and browser gates passed."

  deploy-staging:
    name: Deploy validated build to workers.dev only
    if: needs.validate.result == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.deploy_to_workers_dev == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-staging]')))
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      KAAMKITPRO_STAGING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: "https://stcahnjwonfcuzevfmyg.supabase.co"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_pnD1QuYuIV9qYGRdYJTDGQ_UfwUycgY"
    steps:
      - name: Checkout staging branch only
        uses: actions/checkout@v5
        with:
          ref: cloudflare/vinext-staging
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build staging output
        run: npm run build:vinext
      - name: Bind staging-only Supabase public configuration
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import fs from "node:fs";
            const path = "dist/server/wrangler.json";
            const config = JSON.parse(fs.readFileSync(path, "utf8"));
            if (config.name !== "kaamkitpro-staging") throw new Error("Refusing to add auth config to a non-staging Worker");
            config.vars = { ...(config.vars || {}), KAAMKITPRO_STAGING: "true", NEXT_PUBLIC_SUPABASE_URL: process.env.NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: process.env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY };
            fs.writeFileSync(path, JSON.stringify(config, null, 2) + "\n");
          '
      - name: Verify worker is isolated from production
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          node --input-type=module -e '
            import fs from "node:fs";
            const p = JSON.parse(fs.readFileSync("dist/server/wrangler.json", "utf8"));
            if (p.name !== "kaamkitpro-staging") throw new Error("Refusing deploy: unexpected Worker name");
            if (p.routes?.length || p.route || p.custom_domains?.length || p.domains?.length) throw new Error("Refusing deploy: custom route/domain detected");
            console.log("Verified staging-only Worker name and no custom routes/domains.");
          '
      - name: Configure staging-only Supabase secret
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Missing repository secret SUPABASE_SERVICE_ROLE_KEY; refusing deployment."
            exit 1
          fi
          printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --name kaamkitpro-staging
          echo "Configured Supabase server secret on the isolated staging Worker."
      - name: Deploy to workers.dev
        run: npx vinext-cloudflare deploy --config dist/server/wrangler.json
      # Production domains and deployments are intentionally excluded from this smoke-test gate.
      - name: Post-deploy smoke tests against staging workers.dev only
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base = "https://kaamkitpro-staging.ankitkd550.workers.dev";
          const checks = [
            ["/", async r => r.status === 200 && /noindex/i.test(await r.text()), "homepage + staging noindex"],
            ["/pricing", async r => { const t = await r.text(); return r.status === 200 && /Useful tools/i.test(t) && /Paid plans and checkout are not available/i.test(t); }, "free-only pricing"],
            ["/ads.txt", async r => r.status === 200 && (await r.text()).trim() === "google.com, pub-6738934686699082, DIRECT, f08c47fec0942fa0", "ads.txt publisher line"],
            ["/robots.txt", async r => r.status === 200 && (await r.text()).includes("Disallow: /"), "robots.txt staging exclusion"],
            ["/api/access", async r => { const t = await r.json(); return r.status === 200 && t.plan === "free" && t.isPro === false; }, "anonymous access API"],
            ["/tools/json-formatter", async r => r.status === 200 && /JSON Formatter/.test(await r.text()), "JSON Formatter"],
            ["/tools/pdf-merge", async r => r.status === 200 && /PDF Merge Tool/.test(await r.text()), "PDF Merge"],
            ["/tools/image-rotate", async r => r.status === 200 && /Image Rotate Tool/.test(await r.text()), "Image Rotate"],
            ["/tools/qr-code-generator", async r => r.status === 200 && /QR Code Generator/.test(await r.text()), "QR code generator"],
            ["/tools/gst-calculator", async r => r.status === 200 && /GST Calculator/.test(await r.text()), "GST calculator"],
          ];
          let failures = 0;
          for (const [path, verify, label] of checks) {
            let ok = false;
            let detail = "";
            for (let attempt = 0; attempt < 5; attempt++) {
              try {
                const response = await fetch(base + path, { redirect: "follow" });
                detail = "HTTP " + response.status;
                if (await verify(response)) { ok = true; break; }
              } catch (error) { detail = String(error); }
              await new Promise(resolve => setTimeout(resolve, 1500));
            }
            console.log((ok ? "PASS " : "FAIL ") + label + " — " + detail);
            if (!ok) failures++;
          }
          if (failures) process.exit(1);
          console.log("All post-deploy checks passed for the isolated workers.dev staging URL.");
          NODE
