    stroke-width="16"
    stroke-linecap="round"
  />

  <!-- Toolkit Body -->
  <rect
    x="58"
    y="91"
    width="140"
    height="100"
    rx="24"
    fill="none"
    stroke="#ffffff"
    stroke-width="16"
  />

  <!-- K / Digital Tool Symbol -->
  <path
    d="M106 116v50M106 141l42-25M106 141l43 26"
    fill="none"
