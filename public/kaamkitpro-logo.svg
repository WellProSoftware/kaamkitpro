<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" role="img" aria-labelledby="title desc">
  <title id="title">KaamKitPro Logo</title>
  <desc id="desc">KaamKitPro digital tools logo with a modern toolkit icon and the tagline Har Digital Kaam, Ek Jagah.</desc>

  <defs>
    <linearGradient id="brandGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Brand Icon -->
  <g transform="translate(28 28)">
    <rect
      x="0"
      y="0"
      width="184"
      height="184"
      rx="42"
      fill="url(#brandGradient)"
    />

    <!-- Toolkit Handle -->
    <path
      d="M62 76V63c0-8 6-14 14-14h32c8 0 14 6 14 14v13"
      fill="none"
      stroke="#ffffff"
      stroke-width="12"
      stroke-linecap="round"
    />

    <!-- Toolkit Body -->
    <rect
      x="42"
      y="70"
      width="100"
      height="72"
      rx="18"
      fill="none"
      stroke="#ffffff"
      stroke-width="12"
    />

    <!-- K / Digital Tool Symbol -->
    <path
      d="M76 88v36M76 106l30-18M76 106l31 20"
      fill="none"
      stroke="#ffffff"
      stroke-width="10"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <circle
      cx="125"
      cy="92"
      r="5"
      fill="#ffffff"
    />
  </g>

  <!-- Wordmark -->
  <text
    x="246"
    y="108"
    font-family="Inter, Arial, Helvetica, sans-serif"
    font-size="66"
    font-weight="750"
    letter-spacing="-2.5"
    fill="#0f172a"
  >
    KaamKit<tspan fill="#2563eb">Pro</tspan>
  </text>

  <!-- Tagline -->
  <text
    x="250"
    y="153"
    font-family="Inter, Arial, Helvetica, sans-serif"
    font-size="25"
    font-weight="500"
    letter-spacing="0.4"
    fill="#64748b"
  >
    Har Digital Kaam, Ek Jagah.
  </text>
</svg>
