name: KaamKitPro Razorpay staging validation

on:
  push:
    branches:
      - feature/razorpay-staging-integration
      - feature/remove-otp-auth-staging
      - fix/staging-subscription-updated-event
      - test/subscription-status-behavior

permissions:
  contents: read

concurrency:
  group: kaamkitpro-razorpay-staging-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Build, typecheck, lint and browser regressions (no deployment)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      KAAMKITPRO_STAGING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: "https://stcahnjwonfcuzevfmyg.supabase.co"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_pnD1QuYuIV9qYGRdYJTDGQ_UfwUycgY"
    steps:
      - name: Checkout feature branch head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile for the declared CSS build plugin
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci

      - name: Check Vinext compatibility
        run: npx vinext check

      - name: Build Cloudflare/Vinext output
        run: npm run build:vinext

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Verify standard Next.js build
        run: npm run build

      - name: Install isolated browser-test dependencies
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium

      - name: Run browser regressions against local staging build
        run: npx playwright test -c playwright.cloudflare.config.mjs

      - name: Verify live staging billing endpoints fail closed
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base = "https://kaamkitpro-staging.ankitkd550.workers.dev";
          const checks = [
            {
              label: "invalid Razorpay webhook signature is rejected",
              path: "/api/billing/webhook",
              init: {
                method: "POST",
                headers: {
                  "content-type": "application/json",
                  "x-razorpay-event-id": "staging-invalid-signature-regression",
                  "x-razorpay-signature": "0".repeat(64)
                },
                body: JSON.stringify({ event: "subscription.activated" })
              },
              expected: 401
            },
            {
              label: "signed-out checkout is rejected",
              path: "/api/billing/checkout",
              init: { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ plan_id: "pro-monthly-inr" }) },
              expected: 401
            },
            { label: "signed-out subscription lookup is rejected", path: "/api/billing/subscription", init: {}, expected: 401 },
            {
              label: "signed-out payment verification is rejected",
              path: "/api/billing/verify",
              init: { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ razorpay_payment_id: "pay_test_regression", razorpay_subscription_id: "sub_test_regression", razorpay_signature: "0".repeat(64) }) },
              expected: 401
            },
            {
              label: "signed-out cancellation is rejected",
              path: "/api/billing/cancel",
              init: { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ subscription_id: "sub_test_regression" }) },
              expected: 401
            }
          ];
          let failures = 0;
          for (const check of checks) {
            try {
              const response = await fetch(base + check.path, { redirect: "manual", ...check.init });
              const body = await response.text();
              const ok = response.status === check.expected;
              console.log((ok ? "PASS " : "FAIL ") + check.label + " — HTTP " + response.status);
              if (!ok) {
                console.error("Unexpected response body (truncated): " + body.slice(0, 160).replace(/\s+/g, " "));
                failures++;
              }
            } catch (error) {
              console.error("FAIL " + check.label + " — " + String(error));
              failures++;
            }
          }
          if (failures) process.exit(1);
          console.log("PASS all live staging billing security checks; no payment or subscription mutation was requested.");
          NODE

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: kaamkitpro-razorpay-staging-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            test-results/
            playwright-report/
